[project]
name = "classymail"
version = "1.0.0"
description = "AI-powered email classification pipeline with Mistral OCR, multi-model classification, and RAG chatbot"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
	"fastapi==0.115.0",
	"uvicorn[standard]>=0.30.0",
	"azure-identity==1.17.0",
	"azure-servicebus==7.14.3",
	"azure-storage-blob==12.19.0",
	"azure-cosmos==4.7.0",
	"azure-monitor-opentelemetry>=1.6.4",
	"azure-monitor-opentelemetry-exporter>=1.0.0b46",
	"httpx>=0.27.1",
	"pydantic>=2.11.0",
	"python-dotenv==1.0.1",
	"tenacity==8.2.3",
	"opentelemetry-api==1.39.0",
	"opentelemetry-sdk==1.39.0",
	"opentelemetry-exporter-otlp-proto-http==1.39.0",
	"opentelemetry-instrumentation-fastapi==0.60b0",
	"opentelemetry-instrumentation-httpx==0.60b0",
	"aiohttp==3.13.3",
	"python-multipart==0.0.21",
	"fpdf2==2.7.9",
	"azure-ai-inference>=1.0.0b9",
	"azure-search-documents>=11.5.0",
	"azure-monitor-query>=1.4.0",
	"pdf2image>=1.17.0",
	"pillow>=12.1.0",
	"pymupdf>=1.26.7",
	"azure-ai-textanalytics>=5.3.0",
	"pybreaker==1.2.0",
	"slowapi==0.1.9",
	"aiolimiter==1.1.0",
	"openpyxl>=3.1.0",
	"agent-framework-core>=1.0.0",
	"agent-framework-openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
	"pytest==8.2.0",
	"pytest-asyncio==0.24.0",
	"ruff==0.6.9",
	"pre-commit==3.7.0",
]

[tool.poetry]
name = "classymail"
version = "1.0.0"
description = "AI-powered email classification pipeline with Mistral OCR, multi-model classification, and RAG chatbot"
authors = ["Olivier Mertens <olmertens@microsoft.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
azure-identity = "^1.17.0"
azure-servicebus = "^7.14.3"
azure-storage-blob = "^12.19.0"
azure-cosmos = "^4.7.0"
azure-monitor-opentelemetry = ">=1.6.4"
azure-monitor-opentelemetry-exporter = ">=1.0.0b46"
httpx = "^0.27.0"
pydantic = "^2.6.0"
python-dotenv = "^1.0.1"
tenacity = "^8.2.3"
opentelemetry-api = "^1.39.0"
opentelemetry-sdk = "^1.39.0"
opentelemetry-exporter-otlp-proto-http = "^1.39.0"
opentelemetry-instrumentation-fastapi = "0.60b0"
opentelemetry-instrumentation-httpx = "0.60b0"
aiohttp = "==3.9.5"
python-multipart = "^0.0.21"
fpdf2 = "^2.7.9"
azure-monitor-query = "^1.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.9"
pre-commit = "^3.7.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "execnet>=2.1.2",
    "pre-commit>=3.7.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
index-url = "https://pypi.org/simple"
prerelease = "allow"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["main.py", ".venv"]

[tool.pytest.ini_options]
addopts = "-p no:xdist"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

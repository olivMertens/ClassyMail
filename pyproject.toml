[tool.poetry]
name = "classificationg2s"
version = "0.1.0"
description = "Email classification POC with FastAPI, Azure Service Bus, Cosmos DB, Storage, Mistral OCR, Phi-4"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
azure-identity = "^1.17.0"
azure-servicebus = "^7.15.0"
azure-storage-blob = "^12.19.0"
azure-cosmos = "^4.7.0"
httpx = "^0.27.0"
pydantic = "^2.6.0"
python-dotenv = "^1.0.1"
tenacity = "^8.2.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.uv]
index-url = "https://pypi.org/simple"

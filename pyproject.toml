[project]
name = "classymail"
version = "1.0.0"
description = "AI-powered email classification pipeline with Mistral OCR, multi-model classification, and RAG chatbot"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
	# agent-framework-devui (dev) currently caps fastapi below 0.142.
	"fastapi>=0.140.0,<1",
	"uvicorn[standard]>=0.54.0",
	"azure-identity>=1.26.0,<2",
	"azure-servicebus>=7.15.0,<8",
	"azure-storage-blob>=12.31.0,<13",
	"azure-cosmos>=4.17.1,<5",
	"azure-monitor-opentelemetry>=1.8.11",
	"azure-monitor-opentelemetry-exporter>=1.0.0b58",
	"httpx>=0.28.1,<1",
	"pydantic>=2.14.1,<3",
	"python-dotenv>=1.2.4",
	"tenacity>=9.2.1,<10",
	"opentelemetry-api>=1.39.0",
	"opentelemetry-sdk>=1.39.0",
	"opentelemetry-exporter-otlp-proto-http>=1.39.0",
	"opentelemetry-instrumentation-fastapi>=0.60b0",
	"opentelemetry-instrumentation-httpx>=0.60b0",
	"aiohttp>=3.14.5,<4",
	"python-multipart>=0.0.32",
	"fpdf2>=2.8.9,<3",
	"azure-ai-inference>=1.0.0b9",
	"azure-search-documents>=11.6.0,<12",
	"azure-monitor-query>=1.4.0",
	"pdf2image>=1.17.0",
	"pillow>=12.3.0",
	"pymupdf>=1.28.2",
	"azure-ai-textanalytics>=5.3.0,<6",
	"pybreaker>=1.4.1,<2",
	"slowapi>=0.1.10",
	"aiolimiter>=1.3.0,<2",
	"openpyxl>=3.1.0",
	"agent-framework-core>=1.21.0,<2.0.0",
	"agent-framework-openai>=1.16.0,<2.0.0",
	# Imported directly; OpenAI 3.x migration is a separate, tested step.
	"openai>=2.30.0,<3",
]

[project.optional-dependencies]
dev = [
	"pytest>=9.1.1,<10",
	"pytest-asyncio>=1.4.0,<2",
	"ruff==0.17.0",
	"pre-commit>=4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["classymail"]

[dependency-groups]
dev = [
    "agent-framework-devui>=1.0.0b261008",
    "execnet>=2.1.2",
    "pre-commit>=4.7.0",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
index-url = "https://pypi.org/simple"
# Prereleases only where a dependency explicitly asks for one (never e.g. httpx 1.0.dev).
prerelease = "if-necessary"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["main.py", ".venv"]

[tool.ruff.lint]
# Pre-0.17 ruff defaults; widening the rule set is a separate cleanup.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = "-p no:xdist"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:agent_framework",
    "ignore:.*MemoryStore is experimental.*:UserWarning",
    "ignore:.*SkillResource is experimental.*:UserWarning",
]

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation Interactive - ClassificationG2S</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@11/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="./mermaid-viewer.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 280px;
            background: #2c3e50;
            color: white;
            overflow-y: auto;
            padding: 20px;
        }
        .sidebar h2 {
            margin: 0 0 20px 0;
            font-size: 18px;
            border-bottom: 2px solid #34495e;
            padding-bottom: 10px;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar li {
            margin-bottom: 8px;
        }
        .sidebar a {
            color: #ecf0f1;
            text-decoration: none;
            padding: 8px 12px;
            display: block;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .sidebar a:hover {
            background: #34495e;
        }
        .sidebar a.active {
            background: #3498db;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            background: white;
        }
        .content img {
            max-width: 100%;
        }
        .content pre {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 4px;
            overflow-x: auto;
        }
        .content code {
            background: #f8f9fa;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        .content pre code {
            background: none;
            padding: 0;
        }
        .content blockquote {
            border-left: 4px solid #3498db;
            padding-left: 16px;
            margin-left: 0;
            color: #555;
        }
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 18px;
            color: #666;
        }
        h1 { border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        h2 { margin-top: 30px; border-bottom: 1px solid #ddd; padding-bottom: 8px; }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="sidebar">
            <h2>📚 Documentation</h2>
            <ul id="nav-menu">
                <li><a href="#" data-doc="ARCHITECTURE.md">Architecture</a></li>
                <li><a href="#" data-doc="PIPELINE.md">Pipeline</a></li>
                <li><a href="#" data-doc="SCENARIO_E2E.md">Scénario E2E</a></li>
                <li><a href="#" data-doc="MODELS.md">Modèles</a></li>
                <li><a href="#" data-doc="USER_INTERFACE.md">Interface Utilisateur</a></li>
                <li><a href="#" data-doc="LOCAL_RUN.md">Exécution Locale</a></li>
                <li><a href="#" data-doc="DEV_LOCAL_BUILD.md">Build Local Dev</a></li>
                <li><a href="#" data-doc="TERRAFORM.md">Terraform</a></li>
                <li><a href="#" data-doc="CICD_GITHUB.md">CI/CD GitHub</a></li>
                <li><a href="#" data-doc="README_DIAGRAMS.md">📊 Guide Diagrammes</a></li>
            </ul>
        </nav>
        <main class="content">
            <div class="loader">Chargement...</div>
        </main>
    </div>

    <script>
        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',
            securityLevel: 'loose'
        });

        const content = document.querySelector('.content');
        const navLinks = document.querySelectorAll('#nav-menu a');

        async function loadDoc(filename) {
            content.innerHTML = '<div class="loader">Chargement...</div>';

            try {
                const response = await fetch(`./${filename}`);
                if (!response.ok) throw new Error(`Erreur ${response.status}`);

                const markdown = await response.text();
                content.innerHTML = marked.parse(markdown);

                // Render Mermaid diagrams
                await mermaid.run({
                    querySelector: '.language-mermaid'
                });

                // Add interactive controls
                setTimeout(() => {
                    if (window.MermaidViewer) {
                        MermaidViewer.init();
                    }
                }, 500);

                // Scroll to top
                content.scrollTop = 0;

            } catch (error) {
                content.innerHTML = `
                    <div style="color: #dc3545; padding: 20px; background: #f8d7da; border-radius: 4px;">
                        <h2>❌ Erreur de chargement</h2>
                        <p>${error.message}</p>
                        <p>Fichier: ${filename}</p>
                    </div>
                `;
            }
        }

        // Navigation
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const doc = link.dataset.doc;

                // Update active state
                navLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');

                // Load document
                loadDoc(doc);

                // Update URL hash
                window.location.hash = doc;
            });
        });

        // Load from URL hash or default
        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.slice(1);
            const defaultDoc = hash || 'ARCHITECTURE.md';
            const activeLink = document.querySelector(`[data-doc="${defaultDoc}"]`);

            if (activeLink) {
                activeLink.click();
            } else {
                navLinks[0].click();
            }
        });

        // Handle hash changes
        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.slice(1);
            if (hash) {
                const link = document.querySelector(`[data-doc="${hash}"]`);
                if (link) link.click();
            }
        });
    </script>
</body>
</html>

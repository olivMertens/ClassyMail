name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  IMAGE_NAME: classimail-agent

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v2

      - name: Install & test
        run: |
          uv sync --frozen
          uv run python -m compileall .

      - name: Docker login to ACR
        if: ${{ env.ACR_LOGIN_SERVER != '' && env.ACR_USERNAME != '' && env.ACR_PASSWORD != '' }}
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Azure login (OIDC)
        if: ${{ env.AZURE_CREDENTIALS == '' }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal json)
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker login to ACR (via Azure CLI)
        if: ${{ env.ACR_LOGIN_SERVER == '' || env.ACR_USERNAME == '' || env.ACR_PASSWORD == '' }}
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -z "${{ vars.ACR_NAME }}" ]; then
            echo "Missing vars.ACR_NAME (ACR registry name)." >&2
            exit 1
          fi
          az acr login --name "${{ vars.ACR_NAME }}"
          LOGIN_SERVER=$(az acr show --name "${{ vars.ACR_NAME }}" --query loginServer -o tsv)
          echo "ACR_LOGIN_SERVER=$LOGIN_SERVER" >> $GITHUB_ENV

      - name: Build & push image
        run: |
          REGISTRY="${{ secrets.ACR_LOGIN_SERVER }}"
          if [ -z "$REGISTRY" ]; then REGISTRY="$ACR_LOGIN_SERVER"; fi
          if [ -z "$REGISTRY" ]; then
            echo "Missing ACR login server. Provide secrets.ACR_LOGIN_SERVER or vars.ACR_NAME." >&2
            exit 1
          fi
          IMAGE=${REGISTRY}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Resolve Container Apps environment
        run: |
          ENV_NAME="${{ vars.AZURE_CONTAINERAPP_ENV }}"
          if [ -z "$ENV_NAME" ]; then
            # Par défaut, aligné sur infra/main.tf (prefix=email-poc -> email-poc-env)
            ENV_NAME="email-poc-env"
          fi
          echo "CONTAINERAPPS_ENV=$ENV_NAME" >> $GITHUB_ENV

      - name: Ensure Container App exists
        run: |
          set -euo pipefail

          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ env.IMAGE_NAME }}"
          ENV_NAME="${{ env.CONTAINERAPPS_ENV }}"
          # NOTE: this step only ensures the Container App resource exists.
          # RBAC (AcrPull) is provisioned out-of-band (Terraform / one-time setup).

          if [ -z "$RG" ]; then echo "Missing vars.AZURE_RESOURCE_GROUP" >&2; exit 1; fi
          if [ -z "$APP" ]; then echo "Missing env.IMAGE_NAME" >&2; exit 1; fi
          if [ -z "$ENV_NAME" ]; then echo "Missing env.CONTAINERAPPS_ENV" >&2; exit 1; fi

          # Workaround: deploy action uses --replace-env-vars only supported by update.
          # Pre-create the Container App so the action goes through the update path.
          if ! az containerapp show -n "$APP" -g "$RG" >/dev/null 2>&1; then
            az containerapp create \
              -n "$APP" \
              -g "$RG" \
              --environment "$ENV_NAME" \
              --image "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest" \
              --ingress external \
              --target-port 8000 \
              --env-vars PORT=8000
          fi

      - name: Configure ACR pull (managed identity)
        run: |
          set -euo pipefail

          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ env.IMAGE_NAME }}"
          IDENTITY_NAME="${{ vars.AZURE_IDENTITY_NAME }}"
          ACR_NAME="${{ vars.ACR_NAME }}"

          if [ -z "$RG" ]; then echo "Missing vars.AZURE_RESOURCE_GROUP" >&2; exit 1; fi
          if [ -z "$APP" ]; then echo "Missing env.IMAGE_NAME" >&2; exit 1; fi
          if [ -z "$IDENTITY_NAME" ]; then echo "Missing vars.AZURE_IDENTITY_NAME" >&2; exit 1; fi

          IDENTITY_ID=$(az identity show -g "$RG" -n "$IDENTITY_NAME" --query id -o tsv)

          REGISTRY="$ACR_LOGIN_SERVER"
          if [ -z "$REGISTRY" ]; then
            if [ -z "$ACR_NAME" ]; then echo "Missing vars.ACR_NAME" >&2; exit 1; fi
            REGISTRY=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          fi

          az containerapp identity assign \
            --name "$APP" \
            --resource-group "$RG" \
            --user-assigned "$IDENTITY_ID"

          az containerapp registry set \
            --name "$APP" \
            --resource-group "$RG" \
            --server "$REGISTRY" \
            --identity "$IDENTITY_ID"

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.IMAGE_NAME }}
          containerAppEnvironment: ${{ env.CONTAINERAPPS_ENV }}
          imageToDeploy: ${{ env.IMAGE }}
          ingress: external
          targetPort: 8000
          environmentVariables: >-
            PORT=8000
            AZURE_CLIENT_ID=${{ vars.AZURE_APP_CLIENT_ID }}
            AZURE_SERVICE_BUS_FQDN=${{ vars.AZURE_SERVICE_BUS_FQDN }}
            AZURE_SERVICE_BUS_QUEUE=${{ vars.AZURE_SERVICE_BUS_QUEUE }}
            AZURE_STORAGE_ACCOUNT_URL=${{ vars.AZURE_STORAGE_ACCOUNT_URL }}
            AZURE_STORAGE_CONTAINER=${{ vars.AZURE_STORAGE_CONTAINER }}
            AZURE_COSMOS_ENDPOINT=${{ vars.AZURE_COSMOS_ENDPOINT }}
            AZURE_COSMOS_DB=${{ vars.AZURE_COSMOS_DB }}
            AZURE_COSMOS_CONTAINER=${{ vars.AZURE_COSMOS_CONTAINER }}
            AZURE_AI_ENDPOINT=${{ vars.AZURE_AI_ENDPOINT }}
            MISTRAL_ENDPOINT=${{ vars.AZURE_AI_ENDPOINT }}
            MISTRAL_DEPLOYMENT=${{ vars.MISTRAL_DEPLOYMENT }}
            MISTRAL_MODE=${{ vars.MISTRAL_MODE }}
            PHI_ENDPOINT=${{ vars.AZURE_AI_ENDPOINT }}
            PHI_DEPLOYMENT=${{ vars.PHI_DEPLOYMENT }}

      - name: Assign managed identity to Container App
        run: |
          IDENTITY_NAME="${{ vars.AZURE_IDENTITY_NAME }}"
          if [ -z "$IDENTITY_NAME" ]; then
            echo "Missing vars.AZURE_IDENTITY_NAME (ex: email-poc-id)." >&2
            exit 1
          fi
          IDENTITY_ID=$(az identity show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "$IDENTITY_NAME" --query id -o tsv)
          az containerapp identity assign \
            --name "${{ env.IMAGE_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --user-assigned "$IDENTITY_ID"

name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  IMAGE_NAME: classimail-agent
  WORKER_APP_NAME: classimail-agent-worker

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api_changed: ${{ steps.set.outputs.api_changed }}
      worker_changed: ${{ steps.set.outputs.worker_changed }}
      build: ${{ steps.set.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed for reliable change detection on multi-commit pushes.
          # Using a shallow fetch can omit github.event.before, causing "fatal: bad object".
          fetch-depth: 0

      - name: Detect changes
        id: set
        run: |
          base_ref=${{ github.event.before }}
          if [ -z "$base_ref" ] || [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
            base_ref=HEAD~1
          fi
          # Ensure base_ref exists locally (push events can include multiple commits; shallow clones may not have base_ref).
          if ! git cat-file -e "$base_ref^{commit}" 2>/dev/null; then
            echo "base_ref $base_ref not present locally; fetching..."
            git fetch --no-tags --prune origin "$base_ref" || true
          fi

          files=""
          if git cat-file -e "$base_ref^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$base_ref" HEAD || true)
          else
            echo "Warning: base_ref $base_ref still unavailable; falling back to HEAD~1"
            files=$(git diff --name-only HEAD~1 HEAD || true)
          fi

          if [ -z "$files" ]; then
            echo "Warning: could not compute changed files; defaulting to build=true"
          fi
          echo "Changed files:\n$files"

          api_paths='classificationg2s/api|templates/|static/|classificationg2s/app.py|classificationg2s/services/azure_clients.py|classificationg2s/services/repository.py'
          worker_paths='classificationg2s/services/worker.py|classificationg2s/worker_main.py|classificationg2s/services/pipeline.py|classificationg2s/services/llm_pipeline.py|classificationg2s/services/anonymizer.py|classificationg2s/services/repository.py'
          build_paths='Dockerfile|pyproject.toml|uv.lock|requirements.txt'

          # Build is required for ANY change outside docs/ and README.md
          # (docs-only commits should not build/push or redeploy Container Apps).
          docs_only=true
          if echo "$files" | grep -Evq '^(docs/|README\.md$)'; then docs_only=false; fi

          api_changed=false
          worker_changed=false
          build=true
          if [ -n "$files" ] && [ "$docs_only" = "true" ]; then build=false; fi
          if echo "$files" | grep -Eq "$api_paths"; then api_changed=true; build=true; fi
          if echo "$files" | grep -Eq "$worker_paths"; then worker_changed=true; build=true; fi
          if echo "$files" | grep -Eq "$build_paths"; then build=true; fi

          echo "api_changed=$api_changed" | tee -a $GITHUB_OUTPUT
          echo "worker_changed=$worker_changed" | tee -a $GITHUB_OUTPUT
          echo "build=$build" | tee -a $GITHUB_OUTPUT

  validate:
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      matrix:
        task: [ruff, pytest, terraform, pre-commit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v2

      - name: Install deps
        run: |
          uv sync --frozen --extra dev

      - name: Run ruff
        if: ${{ matrix.task == 'ruff' }}
        run: uv run ruff check .

      - name: Run pytest
        if: ${{ matrix.task == 'pytest' }}
        run: uv run pytest

      - name: Setup Terraform
        if: ${{ matrix.task == 'terraform' || matrix.task == 'pre-commit' }}
        uses: hashicorp/setup-terraform@v3

      - name: Terraform validate
        if: ${{ matrix.task == 'terraform' }}
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform validate

      - name: Run pre-commit
        if: ${{ matrix.task == 'pre-commit' }}
        run: |
          uv run pre-commit run --all-files

  build:
    runs-on: ubuntu-latest
    needs: [changes, validate]
    if: needs.changes.outputs.build == 'true' || github.event_name == 'workflow_dispatch'
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v2

      - name: Install deps (no dev)
        run: |
          uv sync --frozen

      - name: Azure login (OIDC)
        if: ${{ env.AZURE_CREDENTIALS == '' }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal json)
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker login to ACR (via Azure CLI)
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -n "$ACR_LOGIN_SERVER" ] && [ -n "$ACR_USERNAME" ] && [ -n "$ACR_PASSWORD" ]; then
            echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" -u "$ACR_USERNAME" --password-stdin
          else
            if [ -z "${{ vars.ACR_NAME }}" ]; then
              echo "Missing vars.ACR_NAME (ACR registry name)." >&2
              exit 1
            fi
            az acr login --name "${{ vars.ACR_NAME }}"
            LOGIN_SERVER=$(az acr show --name "${{ vars.ACR_NAME }}" --query loginServer -o tsv)
            echo "ACR_LOGIN_SERVER=$LOGIN_SERVER" >> $GITHUB_ENV
          fi

      - name: Fetch Vue runtime (UI)
        run: |
          bash ./scripts/fetch_vue_runtime.sh

      - name: Build & push image
        id: build
        run: |
          REGISTRY="${{ secrets.ACR_LOGIN_SERVER }}"
          if [ -z "$REGISTRY" ]; then REGISTRY="$ACR_LOGIN_SERVER"; fi
          if [ -z "$REGISTRY" ]; then
            echo "Missing ACR login server. Provide secrets.ACR_LOGIN_SERVER or vars.ACR_NAME." >&2
            exit 1
          fi
          IMAGE=${REGISTRY}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -t $IMAGE .
          docker push $IMAGE

  deploy-api:
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.build == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        if: ${{ env.AZURE_CREDENTIALS == '' }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal json)
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve Container Apps environment
        run: |
          ENV_NAME="${{ vars.AZURE_CONTAINERAPP_ENV }}"
          if [ -z "$ENV_NAME" ]; then ENV_NAME="email-poc-env"; fi
          echo "CONTAINERAPPS_ENV=$ENV_NAME" >> $GITHUB_ENV

      - name: Ensure API Container App exists
        run: |
          set -euo pipefail
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ env.IMAGE_NAME }}"
          ENV_NAME="${{ env.CONTAINERAPPS_ENV }}"
          if ! az containerapp show -n "$APP" -g "$RG" >/dev/null 2>&1; then
            az containerapp create \
              -n "$APP" \
              -g "$RG" \
              --environment "$ENV_NAME" \
              --image "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest" \
              --ingress external \
              --target-port 8000 \
              --env-vars PORT=8000
          fi

      - name: Assign managed identity to API Container App
        run: |
          IDENTITY_NAME="${{ vars.AZURE_IDENTITY_NAME }}"
          IDENTITY_ID=$(az identity show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "$IDENTITY_NAME" --query id -o tsv)
          az containerapp identity assign \
            --name "${{ env.IMAGE_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --user-assigned "$IDENTITY_ID"

      - name: Configure ACR pull (API)
        run: |
          REGISTRY="${{ secrets.ACR_LOGIN_SERVER }}"
          if [ -z "$REGISTRY" ]; then
            if [ -n "${{ vars.ACR_NAME }}" ]; then
               REGISTRY=$(az acr show --name "${{ vars.ACR_NAME }}" --query loginServer -o tsv)
            fi
          fi

          if [ -z "$REGISTRY" ]; then
            echo "Error: Could not determine ACR registry name from secrets.ACR_LOGIN_SERVER or vars.ACR_NAME" >&2
            exit 1
          fi

          IDENTITY_ID=$(az identity show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_IDENTITY_NAME }}" --query id -o tsv)
          az containerapp registry set \
            --name "${{ env.IMAGE_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server "$REGISTRY" \
            --identity "$IDENTITY_ID"

      - name: Deploy API to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.IMAGE_NAME }}
          containerAppEnvironment: ${{ env.CONTAINERAPPS_ENV }}
          imageToDeploy: ${{ needs.build.outputs.image }}
          ingress: external
          targetPort: 8000
          environmentVariables: >-
            PORT=8000
            AZURE_CLIENT_ID=${{ vars.AZURE_APP_CLIENT_ID }}
            AZURE_SERVICE_BUS_FQDN=${{ vars.AZURE_SERVICE_BUS_FQDN }}
            AZURE_SERVICE_BUS_QUEUE=${{ vars.AZURE_SERVICE_BUS_QUEUE }}
            AZURE_STORAGE_ACCOUNT_URL=${{ vars.AZURE_STORAGE_ACCOUNT_URL }}
            AZURE_STORAGE_CONTAINER=${{ vars.AZURE_STORAGE_CONTAINER }}
            AZURE_COSMOS_ENDPOINT=${{ vars.AZURE_COSMOS_ENDPOINT }}
            AZURE_COSMOS_DB=${{ vars.AZURE_COSMOS_DB }}
            AZURE_COSMOS_CONTAINER=${{ vars.AZURE_COSMOS_CONTAINER }}
            AZURE_AI_ENDPOINT=${{ vars.AZURE_AI_ENDPOINT }}
            MISTRAL_ENDPOINT=${{ vars.AZURE_AI_ENDPOINT }}
            MISTRAL_DEPLOYMENT=${{ vars.MISTRAL_DEPLOYMENT }}
            MISTRAL_MODE=${{ vars.MISTRAL_MODE }}
            PHI_ENDPOINT=${{ vars.AZURE_AI_ENDPOINT }}
            PHI_DEPLOYMENT=${{ vars.PHI_DEPLOYMENT }}

  deploy-worker:
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.build == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        if: ${{ env.AZURE_CREDENTIALS == '' }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal json)
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve Container Apps environment
        run: |
          ENV_NAME="${{ vars.AZURE_CONTAINERAPP_ENV }}"
          if [ -z "$ENV_NAME" ]; then ENV_NAME="email-poc-env"; fi
          echo "CONTAINERAPPS_ENV=$ENV_NAME" >> $GITHUB_ENV

      - name: Ensure Worker Container App exists
        run: |
          set -euo pipefail
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ env.WORKER_APP_NAME }}"
          ENV_NAME="${{ env.CONTAINERAPPS_ENV }}"

          if ! az containerapp show -n "$APP" -g "$RG" >/dev/null 2>&1; then
            echo "Creating worker app..."
            az containerapp create \
              -n "$APP" \
              -g "$RG" \
              --environment "$ENV_NAME" \
              --image "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest" \
              --min-replicas 0 \
              --max-replicas 1
          else
            echo "Worker app exists. Checking state..."
            STATE=$(az containerapp show -n "$APP" -g "$RG" --query properties.provisioningState -o tsv)
            echo "Current ProvisioningState: $STATE"
            if [ "$STATE" = "Failed" ]; then
              echo "App is in Failed state. Resetting to public helloworld image to unblock provisioning..."
              az containerapp update \
                -n "$APP" \
                -g "$RG" \
                --image "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
            fi
          fi

      - name: Assign managed identity to Worker Container App
        run: |
          set -euo pipefail
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ env.WORKER_APP_NAME }}"
          IDENTITY_NAME="${{ vars.AZURE_IDENTITY_NAME }}"
          IDENTITY_ID=$(az identity show -g "$RG" -n "$IDENTITY_NAME" --query id -o tsv)
          az containerapp identity assign \
            --name "$APP" \
            --resource-group "$RG" \
            --user-assigned "$IDENTITY_ID"

      - name: Configure ACR pull (Worker)
        run: |
          set -euo pipefail
          REGISTRY="${{ secrets.ACR_LOGIN_SERVER }}"
          if [ -z "$REGISTRY" ]; then
            if [ -n "${{ vars.ACR_NAME }}" ]; then
               REGISTRY=$(az acr show --name "${{ vars.ACR_NAME }}" --query loginServer -o tsv)
            fi
          fi

          if [ -z "$REGISTRY" ]; then
            echo "Error: Could not determine ACR registry name from secrets.ACR_LOGIN_SERVER or vars.ACR_NAME" >&2
            exit 1
          fi

          IDENTITY_ID=$(az identity show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_IDENTITY_NAME }}" --query id -o tsv)
          az containerapp registry set \
            --name "${{ env.WORKER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server "$REGISTRY" \
            --identity "$IDENTITY_ID"

      - name: Deploy Worker Container App
        run: |
          set -euo pipefail
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ env.WORKER_APP_NAME }}"
          IMAGE="${{ needs.build.outputs.image }}"

          if [ -z "$IMAGE" ]; then
            echo "needs.build.outputs.image is empty; build job did not produce an image tag." >&2
            exit 1
          fi
          echo "Deploying worker image: $IMAGE"

          # Only update the image tag. Environment variables, identity, and scale rules 
          # are now managed by Terraform resources in infra/main.tf
          az containerapp update \
            -n "$APP" \
            -g "$RG" \
            --image "$IMAGE"
